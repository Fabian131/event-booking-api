openapi: 3.0.3
info:
  title: List Notifications API
  version: 2.0.0

paths:
  /api/v1/notifications:
    get:
      summary: List user notifications
      description: >
        Returns a paginated list of notifications for the authenticated user.
        Filter by `is_read` to show only unread items (badge count use-case).
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: is_read
          schema:
            type: boolean
          example: false
          description: "Filter by read status. Omit to get all notifications."
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
      responses:
        '200':
          description: Paginated list of notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationsResponse'
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    PaginatedNotificationsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NotificationResponse'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    NotificationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        reservation_id:
          type: string
          format: uuid
          nullable: true
          description: "Related reservation, if applicable"
        event_id:
          type: string
          format: uuid
          nullable: true
          description: "Related event, for deep-linking to the event screen"
        type:
          type: string
          enum:
            - reservation_confirmed
            - reservation_cancelled
            - event_updated
            - event_cancelled
            - general
          example: "reservation_confirmed"
        title:
          type: string
          example: "Reservation Confirmed"
        message:
          type: string
          example: "Your reservation for Summer Festival has been confirmed."
        is_read:
          type: boolean
          example: false
        created_at:
          type: string
          format: date-time

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
        has_next_page:
          type: boolean

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
          nullable: true
