openapi: 3.0.3
info:
  title: Calendar Events API
  version: 1.0.0

paths:
  /api/v1/events/calendar:
    get:
      summary: List calendar dates with event counts
      description: >
        Returns all dates in a given month that have at least one active event,
        along with the count of events per date. Used by the calendar grid to
        show dot indicators on days that have scheduled events.
      parameters:
        - in: query
          name: year
          required: true
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
          example: 2026
          description: "Calendar year."
        - in: query
          name: month
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
          example: 7
          description: "Calendar month (1-12)."
      responses:
        '200':
          description: List of dates with event counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarDatesResponse'
        '422':
          description: Validation error (invalid year or month)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    CalendarDatesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CalendarDateItem'
        year:
          type: integer
          example: 2026
        month:
          type: integer
          example: 7

    CalendarDateItem:
      type: object
      properties:
        date:
          type: string
          format: date
          example: "2026-07-15"
        count:
          type: integer
          description: "Number of active events on this date"
          example: 3

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
          nullable: true
