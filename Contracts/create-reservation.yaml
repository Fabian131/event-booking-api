openapi: 3.0.3
info:
  title: Create Reservation API
  version: 1.0.0

paths:
  /api/v1/reservations:
    post:
      summary: Create a reservation
      description: >
        Secures ticket slots for an authenticated customer.
        Validates that `ticket_quantity` does not exceed the event's live
        `remaining_capacity`. Returns 409 if capacity is exceeded.
        Created reservation starts in CONFIRMED status immediately.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
      responses:
        '201':
          description: Reservation created successfully (status = CONFIRMED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '400':
          description: Event is in the past or inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Unauthorized - missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >
            Capacity conflict — ticket_quantity exceeds remaining_capacity,
            or user already has an active reservation for this event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                error: "capacity_conflict"
                message: "Only 3 tickets available, requested 5"
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CreateReservationRequest:
      type: object
      required:
        - event_id
        - ticket_quantity
      properties:
        event_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        ticket_quantity:
          type: integer
          minimum: 1
          maximum: 100
          example: 2
        notes:
          type: string
          maxLength: 500
          example: "Need wheelchair access"

    ReservationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "abc12345-e89b-12d3-a456-426614174000"
        user_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        event_title:
          type: string
          example: "Summer Festival"
        event_date:
          type: string
          format: date
          example: "2026-07-15"
        event_start_time:
          type: string
          format: time
          example: "10:00:00"
        event_end_time:
          type: string
          format: time
          example: "18:00:00"
        ticket_quantity:
          type: integer
          example: 2
        status:
          type: string
          enum: [CONFIRMED, CANCELLED]
          example: "CONFIRMED"
        notes:
          type: string
          nullable: true
        user:
          $ref: '#/components/schemas/ReservationUserContext'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ReservationUserContext:
      type: object
      description: "User context block containing customer profile details"
      properties:
        user_id:
          type: string
          format: uuid
        user_name:
          type: string
          example: "Jane Doe"
        user_email:
          type: string
          format: email
          example: "jane.doe@example.com"

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
          nullable: true

    ValidationError:
      type: object
      properties:
        error:
          type: string
          example: "validation_error"
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
          example:
            - field: "ticket_quantity"
              message: "Only 3 slots available, requested 5"
