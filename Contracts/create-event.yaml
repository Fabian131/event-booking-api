openapi: 3.0.3
info:
  title: Create Event API
  version: 1.0.0

paths:
  /api/v1/events:
    post:
      summary: Create a new event
      description: Creates a new event (requires authentication).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '201':
          description: Event created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed (title too short, invalid capacity, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CreateEventRequest:
      type: object
      required:
        - title
        - location
        - max_capacity
        - category
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 150
          example: "Summer Festival"
        description:
          type: string
          example: "Annual summer celebration"
        location:
          type: string
          minLength: 3
          maxLength: 100
          example: "Central Park"
        max_capacity:
          type: integer
          minimum: 1
          maximum: 32767
          example: 500
        category:
          type: string
          minLength: 2
          maxLength: 50
          example: "Festival"

    EventResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        location:
          type: string
        max_capacity:
          type: integer
        category:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
          nullable: true

    ValidationError:
      type: object
      properties:
        error:
          type: string
          example: "validation_error"
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
          example:
            - field: "title"
              message: "Title must be at least 3 characters"
            - field: "max_capacity"
              message: "Capacity must be greater than 0"
