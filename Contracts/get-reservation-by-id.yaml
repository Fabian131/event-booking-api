openapi: 3.0.3
info:
  title: Get Reservation by ID API
  version: 2.0.0

paths:
  /api/v1/reservations/{reservation_id}:
    get:
      summary: Get reservation by ID
      description: >
        Returns full reservation details by ID.
        Customers can only retrieve their own reservations.
        Business admins can retrieve any reservation.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: reservation_id
          required: true
          schema:
            type: string
            format: uuid
          example: "abc12345-e89b-12d3-a456-426614174000"
      responses:
        '200':
          description: Reservation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Reservation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ReservationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "abc12345-e89b-12d3-a456-426614174000"
        user_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        event_title:
          type: string
          example: "Summer Festival"
        event_date:
          type: string
          format: date
          example: "2026-07-15"
        event_start_time:
          type: string
          format: time
          example: "10:00:00"
        event_end_time:
          type: string
          format: time
          example: "18:00:00"
        ticket_quantity:
          type: integer
          example: 2
        status:
          type: string
          enum: [PENDING, CONFIRMED, CANCELLED]
          example: "CONFIRMED"
        notes:
          type: string
          nullable: true
        user:
          $ref: '#/components/schemas/ReservationUserContext'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ReservationUserContext:
      type: object
      description: "User context block containing customer profile details"
      properties:
        user_id:
          type: string
          format: uuid
        user_name:
          type: string
          example: "Jane Doe"
        user_email:
          type: string
          format: email
          example: "jane.doe@example.com"

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
          nullable: true
