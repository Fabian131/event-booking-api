openapi: 3.0.3
info:
  title: Create Event Schedule API
  version: 1.0.0

paths:
  /api/v1/events/{event_id}/schedules:
    post:
      summary: Create a schedule for an event
      description: Creates a new schedule for an event. Validates time conflicts, capacity, and date constraints.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: event_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventScheduleRequest'
      responses:
        '201':
          description: Schedule created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventScheduleResponse'
        '400':
          description: Validation error (slots exceed capacity, invalid times)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '409':
          description: Schedule conflicts with existing schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '422':
          description: Validation failed (end time before start time, past date)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CreateEventScheduleRequest:
      type: object
      required:
        - schedule_date
        - start_time
        - end_time
        - available_slots
      properties:
        schedule_date:
          type: string
          format: date
          example: "2026-07-15"
        start_time:
          type: string
          format: time
          example: "14:00:00"
        end_time:
          type: string
          format: time
          example: "18:00:00"
        available_slots:
          type: integer
          minimum: 1
          maximum: 32767
          example: 100

    EventScheduleResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        schedule_date:
          type: string
          format: date
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
        available_slots:
          type: integer
        created_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
          nullable: true

    ValidationError:
      type: object
      properties:
        error:
          type: string
          example: "validation_error"
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
          example:
            - field: "end_time"
              message: "End time must be after start time"
            - field: "available_slots"
              message: "Available slots cannot exceed event max capacity"
