openapi: 3.0.3
info:
  title: List Reservations API
  version: 1.0.0

paths:
  /api/v1/reservations:
    get:
      summary: List reservations
      description: >
        Dual-role endpoint. Reservations are created directly in CONFIRMED state
        (no pending/approval flow).
        - **Customer**: No `event_id` → returns "My Reservations" scoped to the token's user.
        - **Business admin**: Supply `event_id` to list all customer reservations for that event,
          including user names and emails for attendance tracking. Optionally filter by `search`.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: event_id
          schema:
            type: string
            format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
          description: "Business use: filter reservations for a specific event."
        - in: query
          name: search
          schema:
            type: string
          example: "Jane"
          description: "Business use: text search on user name or email."
        - in: query
          name: status
          schema:
            type: string
            enum: [CONFIRMED, CANCELLED]
          example: "CONFIRMED"
          description: "Optional status filter (reservations are created as CONFIRMED directly)."
        - in: query
          name: date
          schema:
            type: string
            format: date
          example: "2026-07-15"
          description: "Optional date filter: filter reservations by the date of their corresponding event."
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
      responses:
        '200':
          description: Paginated list of reservations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReservationsResponse'
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    PaginatedReservationsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReservationSummary'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    ReservationSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "abc12345-e89b-12d3-a456-426614174000"
        event_id:
          type: string
          format: uuid
        event_title:
          type: string
          example: "Summer Festival"
        event_date:
          type: string
          format: date
          example: "2026-07-15"
        event_start_time:
          type: string
          format: time
          example: "10:00:00"
        event_end_time:
          type: string
          format: time
          example: "18:00:00"
        ticket_quantity:
          type: integer
          example: 2
        status:
          type: string
          enum: [CONFIRMED, CANCELLED]
          example: "CONFIRMED"
        notes:
          type: string
          nullable: true
        user:
          $ref: '#/components/schemas/ReservationUserContext'
        created_at:
          type: string
          format: date-time

    ReservationUserContext:
      type: object
      description: "User context — always present; populated with full data when admin views an event's reservations."
      properties:
        user_id:
          type: string
          format: uuid
        user_name:
          type: string
          example: "Jane Doe"
        user_email:
          type: string
          format: email
          example: "jane.doe@example.com"

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
        has_next_page:
          type: boolean

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
          nullable: true
