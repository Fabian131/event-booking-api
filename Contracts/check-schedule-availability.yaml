openapi: 3.0.3
info:
  title: Check Schedule Availability API
  version: 1.0.0

paths:
  /api/v1/schedules/{schedule_id}/availability:
    get:
      summary: Check availability for a schedule
      description: Returns availability information for a specific schedule.
      parameters:
        - in: path
          name: schedule_id
          required: true
          schema:
            type: string
            format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        '200':
          description: Availability information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
        '404':
          description: Schedule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    AvailabilityResponse:
      type: object
      properties:
        schedule_id:
          type: string
          format: uuid
        available_slots:
          type: integer
        max_capacity:
          type: integer
        is_available:
          type: boolean

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
          nullable: true
