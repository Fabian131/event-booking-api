openapi: 3.0.3
info:
  title: List Event Schedules API
  version: 1.0.0

paths:
  /api/v1/events/{event_id}/schedules:
    get:
      summary: List schedules for an event
      description: Returns all schedules for a specific event with optional date filters.
      parameters:
        - in: path
          name: event_id
          required: true
          schema:
            type: string
            format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        - in: query
          name: start_date
          schema:
            type: string
            format: date
          example: "2026-07-01"
        - in: query
          name: end_date
          schema:
            type: string
            format: date
          example: "2026-07-31"
      responses:
        '200':
          description: List of schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventScheduleResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    EventScheduleResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        schedule_date:
          type: string
          format: date
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
        available_slots:
          type: integer
        created_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
          nullable: true
