name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          contracts:
            - 'Contracts/**'

  test:
    needs: detect-changes
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install aiosqlite
    
    - name: Run tests
      env:
        # CI test credentials - ephemeral container, not exposed externally
        DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_db
        SECRET_KEY: ${{ secrets.TEST_SECRET_KEY || 'test-secret-key-for-ci-only' }}
        ALGORITHM: HS256
        ACCESS_TOKEN_EXPIRE_MINUTES: 30
        DEBUG: false
        ENVIRONMENT: test
        CORS_ORIGINS: '["http://localhost:3000"]'
        POSTGRES_USER: test
        POSTGRES_PASSWORD: test
        POSTGRES_DB: test_db
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
      run: |
        pytest --cov=app --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  sync-contracts:
    needs: detect-changes
    if: github.event_name == 'push' && needs.detect-changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/checkout@v4
      with:
        repository: Fabian131/event-booking-mobile
        ref: dev
        token: ${{ secrets.FRONTEND_SYNC_PAT }}
        path: mobile-repo

    - name: Copy contracts to frontend
      run: |
        rm -f mobile-repo/event-booking/api-contracts/*.yaml
        cp Contracts/*.yaml mobile-repo/event-booking/api-contracts/

    - name: Push to frontend
      working-directory: mobile-repo
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add event-booking/api-contracts/
        git diff --staged --quiet || (git commit -m "chore: sync API contracts from backend" && git push origin dev)
